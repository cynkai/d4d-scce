name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Static check
        run: python -m pyflakes pipeline.py src scripts api tests
      - name: Tests
        run: python -m pytest -q
      - name: Committed data and evaluation are reproducible
        run: |
          python scripts/generate_synthetic.py
          python pipeline.py
          python scripts/robustness_eval.py
          git diff --exit-code -- data web/report_data.js docs/EVALUATION.md docs/evaluation.json
